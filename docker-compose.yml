services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "${PORT:-4001}:3000"
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev
